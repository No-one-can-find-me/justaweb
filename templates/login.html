{% extends "base.html" %}

{% block title %}Login - Huntsman Space{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2 class="auth-title">Login to Huntsman Space</h2>
                <p class="auth-subtitle">Welcome back, gamer!</p>
            </div>
            
            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username" class="form-label">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        required 
                        placeholder="Enter your username"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        required 
                        placeholder="Enter your password"
                    >
                </div>
                
                <button type="submit" class="auth-btn login-btn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            
            <div class="auth-footer">
                <p class="auth-switch">
                    Don't have an account? 
                    <a href="{{ url_for('register') }}" class="auth-link">Register here</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
