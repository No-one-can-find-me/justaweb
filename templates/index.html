<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huntsman Space</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1 class="logo">Huntsman Space</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/comment">Comment</a>
            <a href="/login">Login</a>
        </nav>
    </header>

    <main>
        <section class="welcome">
            <h2>Welcome to Huntsman Space</h2>
            <div class="social-links">
                <a href="https://www.youtube.com" target="_blank" class="btn">YouTube</a>
                <a href="https://www.kick.com" target="_blank" class="btn">Kick</a>
                <a href="https://www.discord.com" target="_blank" class="btn">Discord</a>
            </div>
        </section>

        <section class="about-me">
            <h2>About Me</h2>
            <div class="video-container">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/DKhehyWLVwc" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </section>

        <section class="comment-section">
            <h2>Comments</h2>
            <ul>
                {% for comment in comments %}
                <li>{{ comment.comment }}</li>
                {% endfor %}
            </ul>
        </section>
    </main>
</body>
</html>
