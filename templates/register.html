{% extends "base.html" %}

{% block title %}Register - Huntsman Space{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2 class="auth-title">Join Huntsman Space</h2>
                <p class="auth-subtitle">Create your gaming account</p>
            </div>
            
            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username" class="form-label">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        required 
                        placeholder="Choose a username"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        required 
                        placeholder="Create a password (min 6 characters)"
                    >
                </div>
                
                <div class="form-group">
                    <label for="confirm_password" class="form-label">
                        <i class="fas fa-lock"></i> Confirm Password
                    </label>
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        class="form-input" 
                        required 
                        placeholder="Confirm your password"
                    >
                </div>
                
                <button type="submit" class="auth-btn register-btn">
                    <i class="fas fa-user-plus"></i> Register
                </button>
            </form>
            
            <div class="auth-footer">
                <p class="auth-switch">
                    Already have an account? 
                    <a href="{{ url_for('login') }}" class="auth-link">Login here</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
