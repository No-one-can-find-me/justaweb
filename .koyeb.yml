name: justaweb
services:
  - name: web
    type: web
    build:
      type: buildpack
    instance_type: nano
    ports:
      - port: 8000
        protocol: http
    env:
      - key: SECRET_KEY
        value: koyeb-production-secret-key-2024-secure-huntsman
      - key: PORT
        value: "8000"
      - key: DATABASE_PATH
        value: "/tmp/database.db"
      - key: FLASK_ENV
        value: "production"
    health_check:
      http:
        path: /health
        port: 8000
        initial_delay_seconds: 30
        timeout_seconds: 10
        interval_seconds: 30
    scaling:
      min: 1
      max: 1
    regions:
      - fra